name: Build Custom Nuvio APK

on:
  push:
    branches: [ cmp-rewrite, main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Clone repository without submodules
        run: |
          git clone --depth 1 --branch cmp-rewrite https://github.com/$GITHUB_REPOSITORY.git src
          cd src
          git config --file .gitmodules --remove-section submodule.MPVKit 2>/dev/null || true
          rm -rf MPVKit .git/modules/MPVKit

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare runtime properties
        run: |
          cd src
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Build fullDebug APK
        run: |
          cd src
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Glass-Debug-APK
          path: src/androidApp/build/outputs/apk/full/debug/*.apk
