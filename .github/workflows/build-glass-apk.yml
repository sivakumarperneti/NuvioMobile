name: Build Custom Nuvio APK

on:
  push:
    branches: [ cmp-rewrite, main, master ]
  workflow_dispatch:

env:
  GIT_SUBMODULE_STRATEGY: none

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: false

      - name: Strip broken submodules from git config
        run: |
          git config --file .gitmodules --remove-section submodule.MPVKit 2>/dev/null || true
          rm -rf MPVKit .git/modules/MPVKit

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare runtime properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Glass-Debug-APK
          path: androidApp/build/outputs/apk/full/debug/*.apk
